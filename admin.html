<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Z Shop | Admin Panel</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .admin-page {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
      padding: 130px 0 70px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .admin-header h1 {
      font-size: 42px;
    }

    .admin-header h1 span {
      color: #d7b878;
      font-family: "Playfair Display", serif;
    }

    .admin-header p {
      color: #777;
      margin-top: 8px;
    }

    .admin-box {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 25px;
    }

    .admin-box h2 {
      margin-bottom: 25px;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 17px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group.full {
      grid-column: 1 / -1;
    }

    .input-group label {
      color: #aaa;
      font-size: 12px;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      background: #0c0c0c;
      color: white;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 13px;
      outline: none;
    }

    .input-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #d7b878;
    }

    .admin-actions {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }

    .admin-products {
      display: grid;
      gap: 12px;
    }

    .admin-product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: rgba(255,255,255,.03);
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .admin-product img {
      width: 75px;
      height: 75px;
      border-radius: 12px;
      object-fit: cover;
    }

    .admin-product-info {
      flex: 1;
    }

    .admin-product-info h3 {
      margin-bottom: 5px;
    }

    .admin-product-info p {
      color: #d7b878;
      font-size: 13px;
    }

    .delete-btn {
      background: rgba(255,70,70,.1);
      color: #ff7777;
      border: 1px solid rgba(255,70,70,.2);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .home-btn {
      border: 1px solid rgba(255,255,255,.1);
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
    }

    @media(max-width:650px) {

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .admin-header h1 {
        font-size: 34px;
      }

      .admin-form {
        grid-template-columns: 1fr;
      }

      .input-group.full {
        grid-column: auto;
      }

      .admin-product {
        align-items: flex-start;
      }

      .admin-product img {
        width: 60px;
        height: 60px;
      }
    }

  </style>
</head>

<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="navbar">

    <a href="index.html" class="brand">
      <img src="profile.jpeg" alt="Z Shop">
      <span>Z <b>SHOP</b></span>
    </a>

    <a href="index.html" class="home-btn">
      ← Customer Site
    </a>

  </header>

  <main class="admin-page">

    <div class="admin-header">

      <div>
        <h1>Z Shop <span>Admin</span></h1>
        <p>Manage your products from one place.</p>
      </div>

    </div>

    <!-- ADD PRODUCT -->

    <section class="admin-box">

      <h2>➕ Add New Product</h2>

      <form id="productForm" class="admin-form">

        <div class="input-group">
          <label>Product Name</label>
          <input
            type="text"
            id="productName"
            placeholder="Enter product name"
            required
          >
        </div>

        <div class="input-group">
          <label>Price (BDT)</label>
          <input
            type="number"
            id="productPrice"
            placeholder="Enter price"
            min="0"
            required
          >
        </div>

        <div class="input-group">
          <label>Category</label>

          <select id="productCategory">

            <option value="electronics">
              Electronics
            </option>

            <option value="fashion">
              Fashion
            </option>

            <option value="accessories">
              Accessories
            </option>

            <option value="other">
              Other
            </option>

          </select>
        </div>

        <div class="input-group">
          <label>Image URL</label>

          <input
            type="text"
            id="productImage"
            placeholder="https://example.com/image.jpg"
          >
        </div>

        <div class="input-group full">

          <label>Description</label>

          <textarea
            id="productDescription"
            placeholder="Write product description..."
          ></textarea>

        </div>

        <div class="admin-actions">

          <button
            type="submit"
            class="btn primary-btn"
          >
            Add Product
          </button>

          <button
            type="button"
            class="btn glass-btn"
            onclick="clearForm()"
          >
            Clear
          </button>

        </div>

      </form>

    </section>

    <!-- PRODUCT LIST -->

    <section class="admin-box">

      <h2>📦 Products</h2>

      <div id="adminProducts" class="admin-products"></div>

    </section>

  </main>

  <script src="admin.js"></script>

</body>
</html>
