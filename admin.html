<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Z Shop | Admin Panel</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f1e9;
  color: #222;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.login,
.dashboard {
  max-width: 550px;
  margin: 70px auto;
  background: white;
  padding: 35px;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,.12);
}

.dashboard {
  max-width: 1100px;
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: auto;
}

h1,
h2 {
  text-align: center;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 12px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 13px 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #111;
  color: white;
  font-weight: bold;
}

.full {
  width: 100%;
  margin-top: 10px;
}

.logout {
  float: right;
}

.form-card {
  background: #f8f6f0;
  padding: 25px;
  border-radius: 20px;
  margin: 30px 0;
}

.product-list {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.product img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.delete {
  background: #b00020;
}

.edit {
  background: #555;
}

.message {
  text-align: center;
  margin: 15px;
  font-weight: bold;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginBox" class="login">

<img src="profile.jpeg" class="logo">

<h1>Z SHOP</h1>

<h2>Admin Login</h2>

<input
  id="email"
  type="email"
  placeholder="Admin Email"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button
  id="loginBtn"
  class="full"
>
  Login
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard" style="display:none;">

<button
  id="logoutBtn"
  class="logout"
>
Logout
</button>

<h1>Z Shop Admin</h1>

<div class="form-card">

<h2 id="formTitle">Add Product</h2>

<input
  id="productName"
  placeholder="Product Name"
>

<input
  id="productPrice"
  type="number"
  placeholder="Price"
>

<input
  id="productOldPrice"
  type="number"
  placeholder="Old Price (optional)"
>

<input
  id="productImage"
  placeholder="Product Image URL"
>

<textarea
  id="productDescription"
  placeholder="Product Description"
></textarea>

<button
  id="saveProductBtn"
  class="full"
>
Add Product
</button>

<button
  id="cancelEditBtn"
  class="full"
  style="display:none;"
>
Cancel Edit
</button>

<div id="productMessage" class="message"></div>

</div>

<h2>Products</h2>

<div
  id="productList"
  class="product-list"
>
</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
