<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Z Shop | Admin Panel</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f1e9;
  color: #222;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.login,
.dashboard {
  max-width: 550px;
  margin: 50px auto;
  background: white;
  padding: 35px;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,.12);
}

.dashboard {
  max-width: 1100px;
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: auto;
}

h1,
h2 {
  text-align: center;
}

input,
textarea,
select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 13px 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #111;
  color: white;
  font-weight: bold;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.full {
  width: 100%;
  margin-top: 10px;
}

.logout {
  float: right;
}

.form-card {
  background: #f8f6f0;
  padding: 25px;
  border-radius: 20px;
  margin: 30px 0;
}

.field-label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 5px;
}

/* IMAGE PREVIEW */

.image-preview-box {
  width: 100%;
  height: 260px;
  margin-top: 12px;
  border: 2px dashed #ccc;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #eee;
}

#imagePreview {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

#previewText {
  color: #888;
  text-align: center;
  padding: 20px;
}

.image-status {
  margin-top: 8px;
  font-size: 14px;
  font-weight: bold;
  min-height: 20px;
}

/* STOCK */

.stock-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.stock-row input {
  flex: 1;
}

.stock-preview {
  margin-top: 10px;
  font-weight: bold;
}

/* PRODUCTS */

.product-list {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
  position: relative;
  overflow: hidden;
}

.product img {
  width: 100%;
  height: 200px;
  object-fit: contain;
  background: #f2f2f2;
  border-radius: 15px;
}

.product h3 {
  margin-bottom: 5px;
}

.product-description {
  color: #777;
  line-height: 1.5;
  font-size: 14px;
}

.product-price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

.old-price {
  color: #999;
  text-decoration: line-through;
  font-size: 14px;
  margin-left: 7px;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.in-stock {
  background: #dff5e3;
  color: #16752b;
}

.out-stock {
  background: #ffe0e0;
  color: #a00000;
}

.featured {
  background: #fff0bd;
  color: #805d00;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.actions button {
  flex: 1;
}

.delete {
  background: #b00020;
}

.edit {
  background: #555;
}

.message {
  text-align: center;
  margin: 15px;
  font-weight: bold;
}

.error {
  color: #b00020;
}

.success {
  color: #16752b;
}

/* MOBILE */

@media(max-width:600px) {

  .login,
  .dashboard {
    margin: 15px;
    padding: 22px;
  }

  .stock-row {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

}

</style>

</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginBox" class="login">

  <img
    src="profile.jpeg"
    class="logo"
    alt="Z Shop"
  >

  <h1>Z SHOP</h1>

  <h2>Admin Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="full"
  >
    Login
  </button>

  <div
    id="loginMessage"
    class="message"
  ></div>

</div>


<!-- ================= DASHBOARD ================= -->

<div
  id="dashboard"
  class="dashboard"
  style="display:none;"
>

  <button
    id="logoutBtn"
    class="logout"
  >
    Logout
  </button>

  <h1>Z Shop Admin</h1>

  <!-- PRODUCT FORM -->

  <div class="form-card">

    <h2 id="formTitle">
      Add Product
    </h2>


    <!-- NAME -->

    <label class="field-label">
      Product Name *
    </label>

    <input
      id="productName"
      type="text"
      placeholder="Example: Premium Watch"
    >


    <!-- PRICE -->

    <label class="field-label">
      Price *
    </label>

    <input
      id="productPrice"
      type="number"
      min="0"
      placeholder="Example: 1500"
    >


    <!-- OLD PRICE -->

    <label class="field-label">
      Old Price
    </label>

    <input
      id="productOldPrice"
      type="number"
      min="0"
      placeholder="Optional"
    >


    <!-- IMAGE -->

    <label class="field-label">
      Product Image Filename *
    </label>

    <input
      id="productImage"
      type="text"
      placeholder="Example: watch.jpg"
      autocomplete="off"
    >

    <small>
      Image must be inside the
      <b>products</b> folder.
    </small>


    <!-- PREVIEW -->

    <div class="image-preview-box">

      <span id="previewText">
        Image preview will appear here
      </span>

      <img
        id="imagePreview"
        alt="Product Preview"
      >

    </div>

    <div
      id="imageStatus"
      class="image-status"
    ></div>


    <!-- STOCK -->

    <label class="field-label">
      Stock Quantity
    </label>

    <input
      id="productStock"
      type="number"
      min="0"
      value="0"
      placeholder="Example: 20"
    >

    <div
      id="stockPreview"
      class="stock-preview"
    >
      🔴 Out of Stock
    </div>


    <!-- FEATURED -->

    <label class="field-label">
      Featured Product
    </label>

    <select id="productFeatured">

      <option value="false">
        No
      </option>

      <option value="true">
        Yes ⭐
      </option>

    </select>


    <!-- DESCRIPTION -->

    <label class="field-label">
      Product Description
    </label>

    <textarea
      id="productDescription"
      placeholder="Write product details..."
    ></textarea>


    <!-- SAVE -->

    <button
      id="saveProductBtn"
      class="full"
      disabled
    >
      Add Product
    </button>

    <button
      id="cancelEditBtn"
      class="full"
      style="display:none;"
    >
      Cancel Edit
    </button>

    <div
      id="productMessage"
      class="message"
    ></div>

  </div>


  <!-- PRODUCT LIST -->

  <h2>
    Products
  </h2>

  <div
    id="productList"
    class="product-list"
  >
    Loading...
  </div>

</div>


<script
  type="module"
  src="admin.js"
></script>

</body>

</html>
