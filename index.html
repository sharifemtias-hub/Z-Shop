<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Z Shop | Premium Shopping</title>

<meta name="description" content="Z Shop - Premium products, modern style and trusted service.">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f3ed;
    color:#171717;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(255,255,255,.72);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(0,0,0,.07);

    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:-2px;
}

.logo span{
    color:#a3834d;
}

.nav-links{
    display:flex;
    gap:32px;
    list-style:none;
}

.nav-links a{
    color:#222;
    font-size:14px;
    font-weight:700;
    transition:.3s;
}

.nav-links a:hover{
    color:#a3834d;
}

.nav-button{
    background:#171717;
    color:#fff;

    padding:12px 23px;

    border-radius:30px;

    font-size:13px;
    font-weight:bold;

    transition:.3s;
}

.nav-button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;

    position:relative;

    display:flex;
    align-items:center;

    padding:130px 7% 90px;

    overflow:hidden;
}


/* 3D ORBS */

.orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.orb1{
    width:480px;
    height:480px;

    right:-120px;
    top:100px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff 0%,
            #dedbd4 12%,
            #9b9892 30%,
            #3c3b39 60%,
            #111 82%
        );

    box-shadow:
        inset -45px -45px 80px rgba(0,0,0,.45),
        0 40px 100px rgba(0,0,0,.22);

    animation:orbFloat 7s ease-in-out infinite;
}

.orb2{
    width:190px;
    height:190px;

    right:32%;
    bottom:40px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff5d8,
            #d4b779,
            #8a6936,
            #241b0b
        );

    box-shadow:
        inset -20px -20px 40px rgba(0,0,0,.45),
        0 25px 60px rgba(0,0,0,.18);

    animation:orbFloat2 6s ease-in-out infinite;
}

@keyframes orbFloat{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-25px) rotate(5deg);
    }

}

@keyframes orbFloat2{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-20px);
    }

}


/* HERO CONTENT */

.hero-content{
    width:56%;
    position:relative;
    z-index:5;
}

.badge{
    display:inline-block;

    padding:9px 18px;

    border-radius:30px;

    background:rgba(163,131,77,.1);

    border:1px solid rgba(163,131,77,.3);

    color:#856632;

    font-size:11px;
    font-weight:800;

    letter-spacing:2px;

    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(55px,7vw,96px);

    line-height:.92;

    letter-spacing:-5px;

    font-weight:900;
}

.hero h1 span{
    color:#a3834d;
}

.hero-text{
    max-width:570px;

    margin-top:30px;

    color:#6e6e6e;

    font-size:17px;

    line-height:1.8;
}

.hero-buttons{
    display:flex;
    gap:15px;

    margin-top:35px;

    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{

    padding:16px 28px;

    border-radius:40px;

    font-size:14px;
    font-weight:bold;

    transition:.35s;
}

.primary-btn{
    background:#171717;
    color:#fff;

    box-shadow:
        0 15px 35px rgba(0,0,0,.2);
}

.primary-btn:hover{
    transform:translateY(-5px) scale(1.03);

    box-shadow:
        0 22px 45px rgba(0,0,0,.3);
}

.secondary-btn{
    background:rgba(255,255,255,.6);

    border:1px solid #bbb;

    color:#222;
}

.secondary-btn:hover{
    transform:translateY(-5px);

    border-color:#a3834d;
}


/* =====================================================
   3D HERO CARD
===================================================== */

.hero-product{

    position:absolute;

    right:8%;
    top:50%;

    transform:translateY(-50%);

    width:365px;
    height:470px;

    perspective:1300px;

    z-index:4;
}

.product-card{

    width:100%;
    height:100%;

    position:relative;

    border-radius:38px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(222,217,207,.7)
        );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        25px 35px 75px rgba(0,0,0,.24),
        inset 1px 1px 0 rgba(255,255,255,.9);

    transform-style:preserve-3d;

    overflow:hidden;

    animation:cardFloat 5s ease-in-out infinite;
}

@keyframes cardFloat{

    0%,100%{
        transform:
            rotateY(-8deg)
            rotateX(5deg)
            translateY(0);
    }

    50%{
        transform:
            rotateY(8deg)
            rotateX(-3deg)
            translateY(-18px);
    }

}

.card-glow{

    position:absolute;

    width:260px;
    height:260px;

    right:-90px;
    top:-80px;

    border-radius:50%;

    background:#d4b776;

    filter:blur(70px);

    opacity:.35;
}

.product-image{

    position:absolute;

    width:225px;
    height:225px;

    left:50%;
    top:55px;

    transform:
        translateX(-50%)
        translateZ(80px);

    object-fit:cover;

    border-radius:32px;

    box-shadow:
        0 30px 55px rgba(0,0,0,.25);
}

.product-info{

    position:absolute;

    left:30px;
    right:30px;
    bottom:30px;

    transform:translateZ(90px);
}

.product-info small{

    color:#967238;

    font-size:11px;

    font-weight:800;

    letter-spacing:3px;
}

.product-info h2{

    font-size:32px;

    margin-top:8px;

    letter-spacing:-1px;
}

.product-info p{

    color:#777;

    margin-top:8px;
}


/* =====================================================
   BRAND / COVER
===================================================== */

.brand-section{

    padding:110px 7%;

    background:#171717;

    color:#fff;

    overflow:hidden;
}

.brand-container{

    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    align-items:center;
}

.cover-box{

    height:350px;

    position:relative;

    border-radius:32px;

    overflow:hidden;

    transform:
        perspective(1000px)
        rotateY(6deg);

    box-shadow:
        25px 35px 70px rgba(0,0,0,.5);
}

.cover-box img{

    width:100%;
    height:100%;

    object-fit:cover;

    transition:.6s;
}

.cover-box:hover img{
    transform:scale(1.08);
}

.cover-box::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.15),
            transparent 45%,
            rgba(0,0,0,.3)
        );

    pointer-events:none;
}

.profile-wrap{

    display:flex;

    align-items:center;

    gap:30px;
}

.profile-wrap img{

    width:145px;
    height:145px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid #fff;

    box-shadow:
        0 20px 50px rgba(0,0,0,.55);

    transition:.4s;
}

.profile-wrap img:hover{

    transform:
        translateY(-8px)
        rotateY(10deg)
        scale(1.04);
}

.brand-text h2{

    font-size:50px;

    letter-spacing:-3px;
}

.brand-text p{

    color:#aaa;

    line-height:1.8;

    margin-top:15px;
}


/* =====================================================
   GENERAL PREMIUM SECTION
===================================================== */

.premium-section{

    padding:120px 7%;

    position:relative;

    overflow:hidden;
}

.section-container{

    max-width:1200px;

    margin:auto;
}

.premium-heading{

    text-align:center;

    margin-bottom:65px;
}

.mini-title{

    display:inline-block;

    color:#a3834d;

    font-size:12px;

    font-weight:800;

    letter-spacing:3px;

    margin-bottom:15px;
}

.premium-heading h2{

    font-size:clamp(42px,6vw,65px);

    letter-spacing:-3px;

    line-height:1;
}

.premium-heading h2 span{

    color:#a3834d;
}

.premium-heading p{

    max-width:650px;

    margin:20px auto 0;

    color:#777;

    line-height:1.8;
}


/* =====================================================
   ABOUT
===================================================== */

.about-section{

    background:#f7f5ef;
}

.about-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:70px;

    align-items:center;
}

.about-visual{

    perspective:1200px;
}

.about-card{

    min-height:400px;

    padding:45px;

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(226,221,211,.75)
        );

    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        25px 35px 70px rgba(0,0,0,.14),
        inset 1px 1px 0 rgba(255,255,255,.9);

    transform-style:preserve-3d;

    transition:.5s;

    position:relative;

    overflow:hidden;
}

.about-card:hover{

    transform:
        rotateX(6deg)
        rotateY(-7deg)
        translateY(-10px);
}

.about-card::before{

    content:"Z";

    position:absolute;

    right:-20px;
    bottom:-90px;

    font-size:310px;

    font-weight:900;

    color:rgba(163,131,77,.07);
}

.about-card-content{

    position:relative;

    z-index:2;

    transform:translateZ(65px);
}

.about-logo{

    width:70px;
    height:70px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:#171717;

    color:#d8bb7a;

    font-size:34px;

    font-weight:900;

    box-shadow:
        10px 15px 30px rgba(0,0,0,.2);

    margin-bottom:30px;
}

.about-card h3{

    font-size:34px;

    margin-bottom:15px;
}

.about-card p{

    color:#777;

    line-height:1.8;
}

.about-text h3{

    font-size:38px;

    letter-spacing:-1.5px;

    margin-bottom:20px;
}

.about-text h3 span{

    color:#a3834d;
}

.about-text p{

    color:#6d6d6d;

    line-height:1.9;

    margin-bottom:18px;
}

.about-points{

    margin-top:30px;

    display:grid;

    gap:15px;
}

.about-point{

    display:flex;

    align-items:center;

    gap:15px;
}

.about-point-icon{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#171717;

    color:#d7bb80;

    border-radius:50%;

    font-size:15px;

    box-shadow:
        5px 8px 18px rgba(0,0,0,.16);
}

.about-point span{

    font-weight:600;

    color:#333;
}


/* =====================================================
   WHY Z SHOP
===================================================== */

.why-section{

    background:#181818;

    color:#fff;
}

.why-section .premium-heading h2{

    color:#fff;
}

.why-section .premium-heading p{

    color:#aaa;
}

.why-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.why-card{

    position:relative;

    padding:40px 32px;

    min-height:280px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 25px 60px rgba(0,0,0,.3);

    transform-style:preserve-3d;

    transition:.45s;

    overflow:hidden;
}

.why-card:hover{

    transform:
        perspective(900px)
        rotateX(7deg)
        rotateY(-7deg)
        translateY(-12px);

    border-color:
        rgba(213,184,121,.5);

    box-shadow:
        0 35px 80px rgba(0,0,0,.45);
}

.why-card::after{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    right:-55px;
    top:-55px;

    border-radius:50%;

    background:#b99a5b;

    filter:blur(55px);

    opacity:.16;
}

.why-icon{

    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(145deg,#292929,#111);

    color:#d6b879;

    font-size:26px;

    margin-bottom:28px;

    box-shadow:
        8px 12px 25px rgba(0,0,0,.4);

    transform:translateZ(55px);
}

.why-card h3{

    font-size:23px;

    margin-bottom:12px;

    transform:translateZ(40px);
}

.why-card p{

    color:#999;

    line-height:1.7;

    transform:translateZ(30px);
}


/* =====================================================
   CONTACT
===================================================== */

.contact-section{

    background:#f7f5ef;
}

.contact-box{

    max-width:1100px;

    margin:auto;

    display:grid;

    grid-template-columns:1fr 1fr;

    border-radius:35px;

    overflow:hidden;

    box-shadow:
        25px 35px 80px rgba(0,0,0,.13);
}

.contact-info{

    padding:55px;

    background:#171717;

    color:#fff;
}

.contact-info h3{

    font-size:40px;

    letter-spacing:-2px;

    margin-bottom:18px;
}

.contact-info h3 span{

    color:#d5b878;
}

.contact-info > p{

    color:#999;

    line-height:1.8;

    margin-bottom:35px;
}

.contact-items{

    display:grid;

    gap:20px;
}

.contact-item{

    display:flex;

    align-items:center;

    gap:18px;
}

.contact-icon{

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:#292929;

    color:#d5b878;

    font-size:18px;

    flex-shrink:0;
}

.contact-item strong{

    display:block;

    margin-bottom:5px;
}

.contact-item a,
.contact-item small{

    color:#999;

    font-size:13px;
}

.contact-item a:hover{

    color:#d5b878;
}

.contact-action{

    padding:55px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #e9e4d9
        );

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;
}

.contact-action::before{

    content:"";

    position:absolute;

    width:230px;
    height:230px;

    right:-80px;
    top:-80px;

    border-radius:50%;

    background:#c5a86c;

    filter:blur(70px);

    opacity:.2;
}

.contact-action-content{

    position:relative;

    z-index:2;
}

.contact-action h3{

    font-size:34px;

    letter-spacing:-1px;

    margin-bottom:15px;
}

.contact-action p{

    color:#777;

    line-height:1.7;

    margin-bottom:30px;
}

.contact-buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.contact-button{

    display:inline-block;

    padding:15px 22px;

    border-radius:40px;

    font-size:13px;

    font-weight:bold;

    transition:.35s;
}

.facebook-btn{

    background:#171717;

    color:#fff;
}

.whatsapp-btn{

    background:#9f824e;

    color:#fff;
}

.contact-button:hover{

    transform:
        translateY(-5px)
        scale(1.03);

    box-shadow:
        0 15px 30px rgba(0,0,0,.18);
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    background:#111;

    color:#777;

    text-align:center;

    padding:32px 20px;

    font-size:13px;
}

footer strong{

    color:#fff;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .navbar{

        padding:0 5%;
    }

    .nav-links{

        display:none;
    }

    .hero{

        display:block;

        padding:
            125px 5%
            80px;
    }

    .hero-content{

        width:100%;

        text-align:center;
    }

    .hero h1{

        letter-spacing:-3px;
    }

    .hero-text{

        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{

        justify-content:center;
    }

    .hero-product{

        position:relative;

        right:auto;
        top:auto;

        transform:none;

        width:310px;
        height:405px;

        margin:70px auto 0;
    }

    .brand-container{

        grid-template-columns:1fr;
    }

    .cover-box{

        transform:none;

        height:300px;
    }

    .profile-wrap{

        flex-direction:column;

        justify-content:center;

        text-align:center;
    }

    .brand-text h2{

        font-size:42px;
    }

    .about-grid{

        grid-template-columns:1fr;

        gap:45px;
    }

    .why-grid{

        grid-template-columns:1fr;
    }

    .contact-box{

        grid-template-columns:1fr;
    }

    .contact-info,
    .contact-action{

        padding:40px 30px;
    }
}


@media(max-width:500px){

    .logo{

        font-size:26px;
    }

    .nav-button{

        padding:10px 16px;

        font-size:12px;
    }

    .hero h1{

        font-size:52px;
    }

    .hero-product{

        width:280px;

        height:370px;
    }

    .product-image{

        width:180px;

        height:180px;
    }

    .product-info h2{

        font-size:27px;
    }

    .cover-box{

        height:230px;
    }

    .premium-section{

        padding:90px 5%;
    }

    .premium-heading h2{

        font-size:42px;
    }

    .about-card{

        padding:32px;
    }

    .about-card h3{

        font-size:29px;
    }

    .contact-info h3{

        font-size:34px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <div class="logo">
        Z<span>Shop</span>
    </div>

    <ul class="nav-links">

        <li>
            <a href="#home">Home</a>
        </li>

        <li>
            <a href="#about">About</a>
        </li>

        <li>
            <a href="#why">Why Z Shop</a>
        </li>

        <li>
            <a href="#contact">Contact</a>
        </li>

    </ul>

    <a href="#contact" class="nav-button">
        Contact Us
    </a>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero" id="home">

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>


    <div class="hero-content">

        <div class="badge">
            PREMIUM ONLINE SHOPPING
        </div>

        <h1>

            Shop
            <span>Beyond</span>

            <br>

            Ordinary.

        </h1>

        <p class="hero-text">

            Welcome to Z Shop — your destination for
            quality products, modern style and a
            premium shopping experience.

        </p>


        <div class="hero-buttons">

            <a
                href="#about"
                class="primary-btn"
            >
                Discover Z Shop →
            </a>

            <a
                href="#contact"
                class="secondary-btn"
            >
                Contact Us
            </a>

        </div>

    </div>


    <!-- 3D CARD -->

    <div class="hero-product">

        <div class="product-card">

            <div class="card-glow"></div>

            <img
                class="product-image"
                src="z-shop-profile.jpeg"
                alt="Z Shop"
            >

            <div class="product-info">

                <small>
                    Z SHOP
                </small>

                <h2>
                    Premium Choice
                </h2>

                <p>
                    Quality • Style • Trust
